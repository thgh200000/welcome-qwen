name: SSH Debug Session with Custom Key

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup tmate session with Custom Key
        id: tmate
        uses: mxschmitt/action-tmate@v3
        with:
          # Your provided ECDSA public key
          ssh-key: "ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzODQAAABhBMxYu9hPmYvBcj+pa3NYiCWjHa6sqXy0QnA3pGSKyty1C30LoDmZkkjpdVNm1cen/jmZNbOGp4ef1Q1tYVetwOAEo8vH4dXCeIGbumlU2BgCQUJUbe71BTZjF/IbhroW5w== first@first-PC"
          limit-access-to-actor: false
          detached: true
      
      - name: Display connection info
        run: |
          echo ""
          echo "=========================================="
          echo "     TMATE SESSION READY WITH YOUR KEY"
          echo "=========================================="
          echo ""
          echo "Connect via SSH using your matching PRIVATE key:"
          echo "Host: ssh.tmate.io"
          echo "Port: 22"
          echo "User: root"
          echo ""
          echo "PuTTY Configuration:"
          echo "1. Host Name: ssh.tmate.io"
          echo "2. Port: 22"
          echo "3. Connection > SSH > Auth > Credentials"
          echo "   - Browse to your private key file (.pem or converted .ppk)"
          echo "4. Click Open"
          echo ""
          echo "OpenSSH Command (for reference):"
          echo "ssh -i /path/to/your/private_key root@ssh.tmate.io"
          echo "=========================================="
      
      - name: Keep session alive
        run: sleep 3600
