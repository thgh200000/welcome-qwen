name: SSH Debug Session with Web Shell

on:
  workflow_dispatch:
    inputs:
      enable_debug:
        description: 'Enable tmate debugging session'
        required: false
        default: 'true'

jobs:
  debug-with-tmate:
    runs-on: ubuntu-latest
    steps:
      # Checkout your repository (optional)
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up tmate session in detached mode to get outputs
      - name: Setup tmate session
        id: tmate
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
          detached: true

      # Explicitly disable secret masking for this step
      - name: Disable masking and show raw tmate info
        run: |
          echo "::remove-masking::true"
          echo "Raw tmate outputs:"
          echo "WEB_URL=${{ steps.tmate.outputs.web-url }}"
          echo "SSH_CMD=${{ steps.tmate.outputs.ssh-command }}"
          echo "SSH_KEY=${{ steps.tmate.outputs.ssh-key }}"

      # Display connection info prominently
      - name: Display connection info
        run: |
          echo ""
          echo "=========================================="
          echo "     TMATE DEBUG SESSION READY"
          echo "=========================================="
          echo ""
          echo "OPTION 1: WEB SHELL (RECOMMENDED - NO KEY NEEDED)"
          echo "Open this URL in your browser:"
          echo "${{ steps.tmate.outputs.web-url }}"
          echo ""
          echo "OPTION 2: SSH WITH KEY (For OpenSSH users)"
          echo "Run this command in your terminal:"
          echo "${{ steps.tmate.outputs.ssh-command }}"
          echo ""
          echo "PRIVATE KEY (Copy this if using SSH):"
          echo "${{ steps.tmate.outputs.ssh-key }}"
          echo ""
          echo "=========================================="
          echo "TROUBLESHOOTING:"
          echo "- If Web Shell gives 503, wait 10 seconds and refresh."
          echo "- For PuTTY: Use the Web Shell URL (no key conversion needed)."
          echo "- The SSH key above is temporary and only works for this session."
          echo "=========================================="
          echo ""

      # Keep the job running so you have time to connect
      - name: Keep session alive
        run: |
          echo "Session active. Waiting for your commands..."
          sleep 3600
